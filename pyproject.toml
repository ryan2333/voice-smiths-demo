[project]
name = "voice-smiths-demo"
version = "0.1.0"
description = "Local chapter-based novel voice-over app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.5",
    "edge-tts>=6.1.12",
    "imageio-ffmpeg>=0.6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
test = ["httpx>=0.28.0"]

[project.scripts]
voice-smiths = "app:main"
